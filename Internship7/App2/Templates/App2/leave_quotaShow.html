<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        table {
            border-collapse: collapse;
            width: 90%;
            max-width: 900px;
            background-color: #fff;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            border-radius: 10px;
            overflow: hidden;
        }

        td, th {
            padding: 12px 15px;
            text-align: center;
        }

        tr:first-child {
            background-color: #007bff;
            color: #fff;
            font-weight: bold;
            text-transform: capitalize;
        }

        tr:nth-child(even) {
            background-color: #f8f9fa;
        }

        tr:hover {
            background-color: #e9f2ff;
        }

        a {
            text-decoration: none;
            color: white;
            background-color: #007bff;
            padding: 6px 12px;
            border-radius: 5px;
            transition: 0.3s;
            margin: 0 3px;
            display: inline-block;
        }

        a:hover {
            background-color: #0056b3;
        }

        /* Responsive styling */
        @media (max-width: 700px) {
            table {
                font-size: 14px;
                width: 100%;
            }
            td, th {
                padding: 8px;
            }
        }
    </style>
</head>
<body>
    <table>
        <tr>
            <td>quoataid</td>
            <td>employeeid</td>
            <td>leave_type</td>
            <td>total_quota</td>
            <td>used_quota</td>
            <td>remain_quota</td>
            <td>Action</td>
        </tr>

        {% for i in range1 %}
        <tr>
            <td>{{i.quotaid}}</td>
            <td>{{i.employeeid}}</td>
            <td>{{i.leave_type}}</td>
            <td>{{i.total_quota}}</td>
            <td>{{i.used_quota}}</td>
            <td>{{i.remain_quota}}</td>
            <td>
                <a href="{% url 'leave_quotaedit' i.quotaid %}">Edit</a>
                <a href="{% url 'leave_quotadelete' i.quotaid %}">Delete</a>
            </td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
